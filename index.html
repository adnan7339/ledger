<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Lookup — CNIC &amp; Sanction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF1F4; --panel:#FFFFFF; --ink:#16202B; --ink-soft:#5B6876;
  --line:#D5DBE3; --line-soft:#E7EBF0; --accent:#0E6E6B; --accent-ink:#FFFFFF;
  --accent-soft:#DCEDEC; --ok:#1B6B3A; --bad:#9B1C23; --radius:10px;
  --shadow:0 1px 0 rgba(22,32,43,.06), 0 8px 24px -18px rgba(22,32,43,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --panel:#151D26; --ink:#E6EDF4; --ink-soft:#93A2B1;
    --line:#293544; --line-soft:#1E2833; --accent:#37B2A6; --accent-ink:#06211F;
    --accent-soft:#12312F; --ok:#5CC98A; --bad:#F0868C;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --panel:#151D26; --ink:#E6EDF4; --ink-soft:#93A2B1;
  --line:#293544; --line-soft:#1E2833; --accent:#37B2A6; --accent-ink:#06211F;
  --accent-soft:#12312F; --ok:#5CC98A; --bad:#F0868C;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px -20px #000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 80px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.top-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:0}
.brand span{font-size:12.5px;color:var(--ink-soft)}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft)}
.dot.live{background:var(--ok)} .dot.err{background:var(--bad)}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;font-size:13.5px}
.ghost:hover{border-color:var(--accent);color:var(--accent)}

.hero{padding:34px 0 8px}
.hero h2{margin:0 0 6px;font-size:clamp(24px,3.4vw,34px);font-weight:600;letter-spacing:-.02em}
.hero p{margin:0 0 20px;color:var(--ink-soft);max-width:62ch}
.searchbar{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;flex-wrap:wrap}
.searchbar select{border:0;background:transparent;color:var(--ink-soft);padding:0 12px;font:inherit;font-size:14px;border-right:1px solid var(--line-soft);min-width:118px}
.searchbar input{flex:1 1 240px;min-width:0;border:0;background:transparent;color:var(--ink);padding:15px 14px;font-size:16px;font-family:"IBM Plex Mono",monospace}
.searchbar input::placeholder{font-family:"IBM Plex Sans",sans-serif;color:var(--ink-soft)}
.searchbar button.go{border:0;background:var(--accent);color:var(--accent-ink);padding:0 26px;font-weight:600;font-size:15px}
.searchbar button.go:disabled{opacity:.45;cursor:not-allowed}
.hint{margin:10px 2px 0;font-size:13px;color:var(--ink-soft)}
.hint b{font-weight:500;color:var(--ink)}

.results{margin-top:30px}
.res-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.res-head h3{margin:0;font-size:16px;font-weight:600}
.res-head .sub{font-size:13.5px;color:var(--ink-soft)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:11px 14px;text-align:left;vertical-align:top;white-space:nowrap}
thead th{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--line-soft);border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
td.num{width:44px;color:var(--ink-soft);font-size:12.5px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.view{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:7px;padding:5px 13px;font-size:13px;font-weight:600}
.view:hover{background:var(--accent);color:var(--accent-ink)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:40px 22px;text-align:center;color:var(--ink-soft)}
.empty strong{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:70;transform:translateX(100%);transition:transform .22s cubic-bezier(.3,.8,.4,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.dhead h4{margin:0 0 4px;font-size:13px;font-weight:500;color:var(--ink-soft)}
.dhead .no{font-size:20px;font-weight:600;letter-spacing:-.01em}
.close{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:17px;margin-left:auto}
.dbody{padding:18px 20px 40px;overflow-y:auto;flex:1}
.entry{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.entry>.eh{padding:9px 14px;background:var(--line-soft);font-size:12.5px;color:var(--ink-soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.field{padding:12px 14px;border-top:1px solid var(--line-soft)}
.field .k{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px}
.field .v{font-size:16px;font-weight:600;word-break:break-word}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:.18s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){th,td{padding:10px 11px} .searchbar select{width:100%;border-right:0;border-bottom:1px solid var(--line-soft);padding:10px 12px}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Record Lookup</h1><span>CNIC &amp; Sanction search</span></div>
    <span class="pill" id="status"><span class="dot" id="dot"></span><span id="statusText">Checking connection…</span></span>
    <button class="ghost" id="themeBtn">Theme</button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h2>Search a member record</h2>
    <p>Type a CNIC number or a sanction number. You'll first see one line per sanction — duplicates are merged. Open any sanction to see its receive date and amount.</p>
    <div class="searchbar">
      <select id="mode" aria-label="Search field">
        <option value="auto">Auto detect</option>
        <option value="cnic">CNIC</option>
        <option value="sanction">Sanction no</option>
      </select>
      <input id="q" type="search" placeholder="e.g. 1610112345678 or SNC-2024-118" autocomplete="off" spellcheck="false">
      <button class="go" id="goBtn">Search</button>
    </div>
    <p class="hint" id="hint">&nbsp;</p>
  </section>

  <section class="results" id="results" hidden></section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerNo">
  <div class="dhead">
    <div><h4>Sanction</h4><div class="no mono" id="drawerNo">—</div></div>
    <button class="close" id="closeBtn" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="drawerBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const API_BASE = ""; // same origin — Vercel serves /api/* alongside this page

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2600); }
function setStatus(text, state){ $("statusText").textContent=text; $("dot").className="dot"+(state==="live"?" live":state==="err"?" err":""); }
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function digits(v){ return String(v??"").replace(/\D+/g,""); }

async function ping(){
  try{
    const r = await fetch(API_BASE+"/api/search?q=__ping__&field=sanction");
    if(r.status>=500) throw new Error("server");
    setStatus("Connected", "live");
  }catch(e){ setStatus("Cannot reach the API", "err"); }
}

async function search(){
  const q = $("q").value.trim();
  const mode = $("mode").value;
  if(!q){ toast("Type a CNIC or sanction number."); return; }
  $("goBtn").disabled = true;
  $("goBtn").innerHTML = '<span class="spin"></span>';
  $("hint").textContent = "Searching…";
  try{
    const r = await fetch(API_BASE+"/api/search?q="+encodeURIComponent(q)+"&field="+mode);
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Search failed");
    render(data, q);
  }catch(e){
    $("results").hidden = true;
    setStatus("Search failed", "err");
    toast(e.message);
  }finally{
    $("goBtn").disabled = false;
    $("goBtn").textContent = "Search";
  }
}

function render(data, q){
  const box = $("results"); box.hidden = false;
  const rows = data.results || [];
  if(!rows.length){
    box.innerHTML = '<div class="empty"><strong>No match for “'+esc(q)+'”</strong>Check the number, or switch the field next to the search box.</div>';
    $("hint").textContent = "0 results.";
    return;
  }
  const extraCols = new Set();
  rows.forEach(r => Object.keys(r).forEach(k => { if(!["sanction_no","member_cnic","entries"].includes(k)) extraCols.add(k); }));
  const cols = ["sanction_no","member_cnic", ...extraCols];

  let html = '<div class="res-head"><h3>'+rows.length+' sanction'+(rows.length>1?'s':'')+'</h3>'
    + '<span class="sub">matching '+(data.field==="cnic"?"CNIC":"sanction no")+' <span class="mono">'+esc(q)+'</span></span></div>';
  html += '<div class="tablewrap"><table><thead><tr><th class="num">#</th>'
    + cols.map(c=>'<th>'+esc(c)+'</th>').join('') + '<th>Entries</th><th></th></tr></thead><tbody>';
  rows.forEach((r,i)=>{
    html += '<tr><td class="num">'+(i+1)+'</td>'
      + cols.map(c=>'<td'+(c==="sanction_no"||c==="member_cnic"?' class="mono"':'')+'>'+esc(r[c])+'</td>').join('')
      + '<td>'+(r.entries>1?'<span class="tag">'+r.entries+'</span>':r.entries)+'</td>'
      + '<td><button class="view" data-s="'+esc(r.sanction_no)+'">View record</button></td></tr>';
  });
  html += '</tbody></table></div>';
  box.innerHTML = html;
  box.querySelectorAll("button.view").forEach(b=>b.addEventListener("click", ()=>openRecord(b.dataset.s)));
  $("hint").textContent = rows.length+" result(s).";
  box.scrollIntoView({behavior:"smooth", block:"start"});
}

async function openRecord(sanction){
  $("drawerNo").textContent = sanction;
  $("drawerBody").innerHTML = '<p style="color:var(--ink-soft)">Loading…</p>';
  $("drawer").classList.add("on"); $("scrim").classList.add("on");
  try{
    const r = await fetch(API_BASE+"/api/record?sanction="+encodeURIComponent(sanction));
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Could not load record");
    if(!data.entries.length){
      $("drawerBody").innerHTML = '<p style="color:var(--ink-soft)">No entries found.</p>';
      return;
    }
    let html = "";
    data.entries.forEach((e,i)=>{
      html += '<div class="entry"><div class="eh">Entry '+(i+1)+' of '+data.entries.length+'</div><div class="fields">'
        + '<div class="field"><div class="k">Receive Date</div><div class="v">'+(esc(e.receive_date)||"—")+'</div></div>'
        + '<div class="field"><div class="k">Amount</div><div class="v">'+(esc(e.amount)||"—")+'</div></div>'
        + '</div></div>';
    });
    $("drawerBody").innerHTML = html;
  }catch(e){
    $("drawerBody").innerHTML = '<p style="color:var(--bad)">'+esc(e.message)+'</p>';
  }
}
function closeRecord(){ $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); }

$("goBtn").addEventListener("click", search);
$("q").addEventListener("keydown", e=>{ if(e.key==="Enter") search(); });
$("closeBtn").addEventListener("click", closeRecord);
$("scrim").addEventListener("click", closeRecord);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeRecord(); });
$("themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark" : (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("rl_theme_v1", next); }catch(e){}
});
try{ const t=localStorage.getItem("rl_theme_v1"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}

ping();
</script>
</body>
</html>
